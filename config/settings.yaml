# ============================================================
# rwa-signal 核心配置
# 改这里，不要改代码。
# ============================================================

# --- 你的账号定位（所有草稿都基于这段，务必写准） ---
identity:
  handle: "lilysharp88"                 # 2026-09-12 自动探测自已登录会话
  niche: "RWA / 真实世界资产代币化"

  # 背景：top program 经济学博士。这不是装饰——它是唯一的结构性优势来源。
  # 圈内不缺"懂行的人"，缺的是有分析框架的人。
  background: "economics PhD (top program)"

  angle: >-
    用经济学的分析工具拆解代币化：市场微观结构、流动性、套利边界、
    信息不对称、权利分离。别人讲"这个赛道多大"，你讲"这个机制为什么
    会失效、在什么条件下失效"。

  # 具体可调用的框架（写草稿和选题时优先往这些上靠）
  frameworks:
    - "市场微观结构：价格发现、买卖价差、深度、逆向选择、做市商库存"
    - "流动性理论：Amihud 非流动性、Kyle lambda、一二级市场分层"
    - "套利边界：law of one price、limits to arbitrage、市场分割"
    - "权利分离：现金流权 vs 控制权（Grossman-Hart）、投票权溢价"
    - "中介理论：期限转换、Diamond-Dybvig、影子银行"
    - "信息经济学：信息不对称、信号、披露制度设计"
    - "机制设计与监管经济学"

  # 已识别的、可直接动手的学术切口（来自实际抓取的数据）
  live_hooks:
    - "AMC 代币曾交易在标的 60 倍 —— law of one price 失效的实证案例：
       无赎回机制 + 无法做空 + 市场分割，三个套利障碍同时存在"
    - "代币化国债绝大部分只有 mint/redeem、几乎无二级交易 ——
       代币化宣称的流动性收益基本未兑现，这是可证伪的命题"
    - "Robinhood 代币 = 1:1 抵押的债务证券，有分红无投票权 ——
       现金流权与控制权分离，可接 dual-class / voting premium 文献"
    - "Centrifuge 持有人增速是资金增速 20 倍 —— 持仓分布问题，
       均值-中位数背离，真实采用与空投粉尘在持有人数上不可区分"

  own_content_language: "zh"    # 中文创作，英文评论（跟随原帖）
  avoid_topics: ["价格预测", "喊单", "meme币", "空投攻略"]

  # 定位一句话（写 bio 和自我介绍用）
  positioning: "把代币化当作一个市场设计问题来研究，而不是当作一个赛道来喊单。"

# --- 评论机会筛选（comment_watch 用） ---
comment_watch:
  interval_minutes: 20          # cron 频率
  max_post_age_minutes: 90      # 超过这个年龄的帖子不抢，位置已经没了
  # 回复语言策略：match = 跟随原帖语言（推荐，符合评论区语境）
  reply_language: "match"
  drafts_per_opportunity: 3     # 每个机会给几条不同角度的草稿
  # 打分门槛，0-100。低于此分不打扰你。
  min_score: 62
  scoring_weights:
    velocity: 0.30              # 互动上升速度
    reach: 0.20                 # 作者影响力
    gap: 0.30                   # 评论区是否还有空位（最重要之一）
    relevance: 0.20             # 与你 niche 的贴合度

# --- 账号保护：冷启动限速（重要，别调高） ---
# 新号高频互动是最快的封号路径。这是自我约束，不是平台限制。
safety:
  account_age_weeks: 0          # 你的账号开了几周
  ramp_schedule:                # 每周每日回复上限，按周自动放宽
    week_1: 3
    week_2: 5
    week_3: 8
    week_4_plus: 12
  min_gap_minutes: 25           # 两次回复之间的最小间隔
  max_likes_per_day: 30         # 点赞也计入风控，别刷
  never_reply_to: []            # 明确不碰的账号（例如已拉黑你的）

# --- 晨报 ---
digest:
  schedule: "0 7 * * *"         # 每天 7:00（cron 表达式，本地时区）
  lookback_hours: 24
  hot_topic_window_hours: 168   # 叙事聚类看 7 天，才能发现"拐点"
  max_topics: 6
  content_angles_per_digest: 3

# --- 热点/叙事检测 ---
signal:
  # "收敛"= 多少个互不相关的账号在同一时间窗说同一件事，才算真热点
  convergence_min_accounts: 3
  convergence_window_hours: 48
  # 只统计这些互动量以上的帖子，避免噪音
  min_engagement_for_signal: 20
